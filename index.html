<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Downtown Gardener</title>
<link rel="icon" href="img/kochu.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="launch">
  <svg class="sky" viewBox="0 0 800 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g fill="#1b2a49"><rect x="20" y="180" width="70" height="220"/><rect x="100" y="130" width="60" height="270"/><rect x="170" y="210" width="90" height="190"/><rect x="280" y="110" width="70" height="290"/><rect x="360" y="170" width="80" height="230"/><rect x="450" y="90" width="60" height="310"/><rect x="520" y="200" width="90" height="200"/><rect x="620" y="140" width="70" height="260"/><rect x="700" y="190" width="90" height="210"/></g><g fill="#ffd96b" opacity=".8"><rect x="35" y="200" width="8" height="8"/><rect x="115" y="150" width="8" height="8"/><rect x="295" y="130" width="8" height="8"/><rect x="465" y="110" width="8" height="8"/><rect x="635" y="160" width="8" height="8"/><rect x="380" y="190" width="8" height="8"/><rect x="545" y="220" width="8" height="8"/><rect x="720" y="210" width="8" height="8"/><rect x="190" y="230" width="8" height="8"/></g></svg>
  <div class="leaves"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="logo">
    <div class="sprout">&#127793;</div>
    <h1>Downtown<br>Gardener</h1>
    <p>Grow a little green in the big grey city.</p>
  </div>
  <div id="parade"></div>
  <div class="lbtns">
    <button id="play" class="big">Start Gardening</button>
    <button id="newgame" class="ghost" hidden>New Garden</button>
  </div>
  <small class="credit">Currency: <img src="img/kochu.svg" alt="" class="k"> Kochu</small>
</div>

<div id="game" hidden>
  <svg class="sky" viewBox="0 0 800 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g fill="#1b2a49"><rect x="20" y="180" width="70" height="220"/><rect x="100" y="130" width="60" height="270"/><rect x="170" y="210" width="90" height="190"/><rect x="280" y="110" width="70" height="290"/><rect x="360" y="170" width="80" height="230"/><rect x="450" y="90" width="60" height="310"/><rect x="520" y="200" width="90" height="200"/><rect x="620" y="140" width="70" height="260"/><rect x="700" y="190" width="90" height="210"/></g><g fill="#ffd96b" opacity=".8"><rect x="35" y="200" width="8" height="8"/><rect x="115" y="150" width="8" height="8"/><rect x="295" y="130" width="8" height="8"/><rect x="465" y="110" width="8" height="8"/><rect x="635" y="160" width="8" height="8"/><rect x="380" y="190" width="8" height="8"/><rect x="545" y="220" width="8" height="8"/><rect x="720" y="210" width="8" height="8"/><rect x="190" y="230" width="8" height="8"/></g></svg>
  <header>
    <div class="brand">&#127807; <span>LV</span> Downtown Gardener</div>
    <div class="wallet"><img src="img/kochu.svg" alt="Kochu" class="k"><span id="kochu">0</span></div>
  </header>
  <main>
    <section id="garden">
      <div id="grid"></div>
      <div id="bar"></div>
      <div class="hint" id="hint">Pick a seed, tap soil to sow, water it with the can, then wait for it to grow.</div>
      <button id="harvestAll" hidden>Harvest all ready</button>
    </section>
    <section id="page" hidden></section>
  </main>
  <nav id="tabs">
    <button data-view="garden" class="on">&#127969;<span>Garden</span></button>
    <button data-view="inv">&#129530;<span>Inventory</span></button>
    <button data-view="seeds">&#127793;<span>Seed Shop</span></button>
    <button data-view="tools">&#129683;<span>Tool Shop</span></button>
  </nav>
  <div id="toast"></div>
</div>
<script src="game.js"></script>
</body>
</html>
